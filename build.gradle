plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.1.10'
    id 'application'
}

group 'fry-code-runner'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url "https://jitpack.io" }
}

mainClassName = "com.code.fry.MQMain"

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    // https://mvnrepository.com/artifact/com.google.code.gson/gson
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.8.5'
    // https://mvnrepository.com/artifact/commons-cli/commons-cli
    implementation group: 'commons-cli', name: 'commons-cli', version: '1.4'
    implementation 'com.rabbitmq:amqp-client:5.5.0'
    implementation "org.postgresql:postgresql:42.2.2"
    implementation 'org.jetbrains.exposed:exposed-core:0.60.0'
    implementation 'org.jetbrains.exposed:exposed-crypt:0.60.0'
    implementation 'org.jetbrains.exposed:exposed-dao:0.60.0'
    implementation 'org.jetbrains.exposed:exposed-jdbc:0.60.0'
    implementation 'org.jetbrains.exposed:exposed-jodatime:0.60.0'

    implementation 'org.jetbrains.exposed:exposed-json:0.60.0'
    implementation 'org.jetbrains.exposed:exposed-money:0.60.0'

// https://mvnrepository.com/artifact/org.slf4j/slf4j-api
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '1.7.25'
// https://mvnrepository.com/artifact/org.slf4j/slf4j-simple
    implementation group: 'org.slf4j', name: 'slf4j-simple', version: '1.6.1'
    //state machine
    implementation 'com.github.tinder:statemachine:0.1.2'

    //apache database connection pool
    // https://mvnrepository.com/artifact/org.apache.commons/commons-dbcp2
    implementation group: 'org.apache.commons', name: 'commons-dbcp2', version: '2.0'



    testImplementation group: 'junit', name: 'junit', version: '4.12'
}



jar{
    manifest {
        attributes  "Main-Class": 'com.code.fry.MQMain'
    }
    // Add this
    from {
        exclude "META-INF/LICENSE*"
        exclude "META-INF/NOTICE*"

        configurations.compile.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
}